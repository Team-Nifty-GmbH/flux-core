name: Build CI Image

on:
  push:
    branches: [main, dev]
    paths: ['.github/docker/Dockerfile']
  workflow_dispatch:

jobs:
  build:
    # x86 host on purpose: it emulates arm64 through QEMU, which is reliable in
    # this direction. Building on an arm64 runner would need amd64 emulation.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/team-nifty-gmbh/flux-ci:php8.5
